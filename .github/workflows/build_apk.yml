name: Build QuickScan PDF APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Platform Files
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.quickscan
          python3 -c '
import os
path = "android/app/src/main/AndroidManifest.xml"
if os.path.exists(path):
    with open(path, "r") as f:
        content = f.read()
    permissions = """
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-feature android:name="android.hardware.camera" android:required="false" />
    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
"""
    if "<application" in content and "android.permission.CAMERA" not in content:
        content = content.replace("<application", permissions + "\n    <application", 1)
        with open(path, "w") as f:
            f.write(content)
'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickScan_PDF_Release_APK
          path: build/app/outputs/flutter-apk/app-release.apk
