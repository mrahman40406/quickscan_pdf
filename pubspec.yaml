publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cunning_document_scanner: ^1.4.1
  pdf: ^3.10.8
  printing: ^5.13.1
  path_provider: ^2.1.2
  share_plus: ^10.0.2
  open_filex: ^4.5.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
